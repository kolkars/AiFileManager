[project]
name = "ai-file-manager"
version = "0.1.0"
description = "Local-first, domain-agnostic file indexing and keyword search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "sqlalchemy>=2.0.36",
  "typer>=0.15.1",
  "watchdog>=6.0.0",
]

[project.scripts]
ai-files = "ai_file_manager.cli:app"

[dependency-groups]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
